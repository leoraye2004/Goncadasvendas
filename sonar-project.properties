# SonarCloud — organização e projeto (o projeto precisa ser importado em sonarcloud.io).
sonar.organization=leoraye2004
sonar.projectKey=leoraye2004_Goncadasvendas
sonar.projectName=GoncadasVendas

# Código, testes e relatórios de cobertura (gerados por `npm test`).
sonar.sources=app,components,lib,repositories,services,prisma,middleware.ts
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.javascript.lcov.reportPaths=coverage/backend/lcov.info,coverage/frontend/lcov.info

# Fora da análise.
sonar.exclusions=**/node_modules/**,.next/**,coverage/**,docs/**,infra/**,prisma/migrations/**

# Fora da conta de cobertura: infra, migrations, configs e o que o Vitest também não mede
# (lib/prisma.ts só liga o banco; prisma/seed.ts é script; *.d.ts são só tipos).
sonar.coverage.exclusions=infra/**,prisma/migrations/**,**/*.config.*,lib/prisma.ts,prisma/seed.ts,**/*.d.ts
