name: CI

# Roda em todo PR e em todo push na main. O deploy no Azure entra depois da #7.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Um PR novo cancela a execução antiga do mesmo PR. Na main nunca cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qualidade:
    name: Lint, testes e SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # o Sonar precisa do histórico completo para achar o autor de cada linha

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes (backend e frontend, gera os lcov.info)
        run: npm test

      # Se o Quality Gate reprovar, este passo falha e o PR não pode ser mesclado.
      - name: Análise do SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Aviso - SonarCloud não configurado
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning title=SonarCloud pulado::O secret SONAR_TOKEN não existe neste repositório (ou este PR veio de um fork). Lint e testes rodaram, mas a análise de qualidade NÃO."
