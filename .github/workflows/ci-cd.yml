name: CI

# Roda em todo PR e em todo push na main. Na main, publica a imagem no GHCR e faz o deploy no Azure.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Um PR novo cancela a execução antiga do mesmo PR. Na main nunca cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qualidade:
    name: Lint, testes e SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # o Sonar precisa do histórico completo para achar o autor de cada linha

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes (backend e frontend, gera os lcov.info)
        run: npm test

      # Se o Quality Gate reprovar, este passo falha e o PR não pode ser mesclado.
      - name: Análise do SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Aviso - SonarCloud não configurado
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning title=SonarCloud pulado::O secret SONAR_TOKEN não existe neste repositório (ou este PR veio de um fork). Lint e testes rodaram, mas a análise de qualidade NÃO."

  # Em PR só constrói a imagem (para pegar erro de Dockerfile). Na main, também publica no GHCR.
  imagem:
    name: Imagem Docker (GHCR)
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # permite ao GITHUB_TOKEN publicar o pacote no GHCR
    env:
      IMAGEM: ghcr.io/leoraye2004/goncadasvendas
      PUBLICAR: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Login no GHCR
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir (e publicar, na main)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest
          labels: org.opencontainers.image.source=https://github.com/leoraye2004/Goncadasvendas
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Só na main. Troca a imagem do Container App pela do commit e confere se o app responde.
  # Entra no Azure por OIDC (sem senha guardada). Se os secrets do Azure não existirem, avisa e pula.
  deploy:
    name: Deploy no Azure
    needs: imagem
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # permite pedir o token OIDC ao GitHub
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      GRUPO: rg-goncadasvendas
      APP: ca-goncadasvendas
    steps:
      - name: Aviso - Azure não configurado
        if: env.AZURE_CLIENT_ID == ''
        run: |
          echo "::warning title=Deploy pulado::Faltam os secrets AZURE_CLIENT_ID, AZURE_TENANT_ID e AZURE_SUBSCRIPTION_ID."

      - name: Login no Azure (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Trocar a imagem do Container App
        if: env.AZURE_CLIENT_ID != ''
        run: |
          az containerapp update -g "$GRUPO" -n "$APP"             --image "ghcr.io/leoraye2004/goncadasvendas:${{ github.sha }}"

      # O app pode estar dormindo (0 réplicas) e a nova revisão leva um tempo para subir: tenta por até ~5 min.
      - name: Teste rápido em /api/health
        if: env.AZURE_CLIENT_ID != ''
        run: |
          fqdn=$(az containerapp show -g "$GRUPO" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          for tentativa in $(seq 1 20); do
            codigo=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "https://$fqdn/api/health" || true)
            echo "tentativa $tentativa: HTTP $codigo"
            [ "$codigo" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::/api/health não respondeu 200"
          exit 1
